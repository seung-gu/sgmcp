<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save and recall across apps</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase;
      font-weight: 500;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · sgmcp</p>
    <h1>Save in one app, recall in another</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="save-and-recall-title save-and-recall-desc">
        <title id="save-and-recall-title">Save and recall across apps</title>
        <desc id="save-and-recall-desc">A claude.ai conversation is saved to sgmcp after every answer; later, ChatGPT searches sgmcp, opens the matching stretch and answers with that history.</desc>
        <defs>
          <style>
            .name  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
            .sub   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
            .subk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .lbl   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.08em; }
            .lblk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 500; }
            .eye   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.14em; fill: #5a6580; }
            .eyek  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 500; fill: #5a6580; }
            .op    { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.12em; fill: #4f5d75; }
            .guard { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.04em; fill: #4f5d75; }
            .guardk { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .key   { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #4f5d75; }
            .keyk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .note  { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: 14px; font-style: italic; fill: #2d3142; }
            .notek { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: 14px; fill: #2d3142; }
          </style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <rect x="288" y="176" width="416" height="132" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <rect x="288" y="176" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <text x="308" y="188" class="op" text-anchor="middle">LOOP</text>

        <text x="332" y="212" class="guard" text-anchor="start">[after every answer]</text>

        <line x1="120" y1="96" x2="120" y2="588" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <line x1="320" y1="96" x2="320" y2="588" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <line x1="560" y1="96" x2="560" y2="588" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <line x1="800" y1="96" x2="800" y2="588" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <line x1="120" y1="148" x2="318" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="320" y1="240" x2="558" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 560 260 H 596 V 284 H 564" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>

        <line x1="120" y1="392" x2="798" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="800" y1="424" x2="562" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="560" y1="456" x2="798" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <line x1="800" y1="488" x2="562" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="560" y1="520" x2="798" y2="520" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <line x1="800" y1="560" x2="122" y2="560" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <rect x="204" y="130" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="139" class="lbl" text-anchor="middle" fill="#4f5d75">CHAT</text>

        <rect x="398" y="222" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="231" class="lbl" text-anchor="middle" fill="#4f5d75">SAVE · APPEND</text>

        <rect x="604" y="266" width="88" height="12" rx="2" fill="#f5f5f5"/>

        <text x="648" y="275" class="lbl" text-anchor="middle" fill="#4f5d75">INDEX PASSAGES</text>

        <rect x="182" y="374" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="383" class="lbl" text-anchor="middle" fill="#4f5d75">ASK ABOUT IT</text>

        <rect x="658" y="406" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="415" class="lbl" text-anchor="middle" fill="#4f5d75">SEARCH</text>

        <rect x="652" y="438" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="447" class="lbl" text-anchor="middle" fill="#4f5d75">SECTIONS</text>

        <rect x="642" y="470" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="479" class="lbl" text-anchor="middle" fill="#4f5d75">OPEN SECTION</text>

        <rect x="652" y="502" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="680" y="511" class="lbl" text-anchor="middle" fill="#4f5d75">MESSAGES</text>

        <rect x="198" y="542" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="220" y="551" class="lbl" text-anchor="middle" fill="#bf4520">ANSWER</text>

        <text x="220" y="348" class="note" text-anchor="middle">Later, in another app</text>

        <rect x="40" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="40" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="120" y="64" class="name" text-anchor="middle">You</text>
        <text x="120" y="80" class="sub" text-anchor="middle">phone · desktop · web</text>

        <rect x="240" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="320" y="64" class="name" text-anchor="middle">claude.ai</text>
        <text x="320" y="80" class="sub" text-anchor="middle">MCP connector</text>

        <rect x="480" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="40" width="160" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="560" y="64" class="name" text-anchor="middle">sgmcp</text>
        <text x="560" y="80" class="sub" text-anchor="middle">archive · search</text>

        <rect x="720" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="720" y="40" width="160" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="800" y="64" class="name" text-anchor="middle">ChatGPT</text>
        <text x="800" y="80" class="sub" text-anchor="middle">MCP connector</text>

        <line x1="56" y1="616" x2="904" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <line x1="56" y1="640" x2="84" y2="640" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="92" y="644" class="key" text-anchor="start">call</text>
        <line x1="148" y1="640" x2="176" y2="640" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="184" y="644" class="key" text-anchor="start">reply</text>
        <line x1="248" y1="640" x2="276" y2="640" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
        <text x="284" y="644" class="key" text-anchor="start">background</text>
        <line x1="380" y1="640" x2="408" y2="640" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="416" y="644" class="key" text-anchor="start">answer with history</text>
      </svg>
    </div>
  </div>
</body>
</html>
