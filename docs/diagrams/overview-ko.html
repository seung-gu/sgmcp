<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sgmcp 전체 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1160px; width: 100%; }
    .eyebrow {
      font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 0.8rem; letter-spacing: 0;
      font-weight: 500;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">전체 흐름 · sgmcp</p>
    <h1>sgmcp 안에서 대화가 지나가는 길</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-ko-title overview-ko-desc">
        <title id="overview-ko-title">sgmcp 전체 흐름</title>
        <desc id="overview-ko-desc">앱이 원문 메시지를 저장하고, 저장마다 새 검색 조각을 색인하며, 그룹 새로고침이 제목·그룹·지도를 만들고, 검색은 구간을 돌려준 뒤 메시지를 다시 읽기.</desc>
        <defs>
          <style>
            .name  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
            .sub   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
            .subk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .lbl   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.08em; }
            .lblk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 500; }
            .eye   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.14em; fill: #5a6580; }
            .eyek  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 500; fill: #5a6580; }
            .op    { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.12em; fill: #4f5d75; }
            .guard { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.04em; fill: #4f5d75; }
            .guardk { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .key   { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #4f5d75; }
            .keyk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .note  { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: 14px; font-style: italic; fill: #2d3142; }
            .notek { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: 14px; fill: #2d3142; }
          </style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <rect x="24" y="32" width="200" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="106" y="38" width="36" height="16" rx="2" fill="#f5f5f5"/>
        <text x="124" y="50" class="eyek" text-anchor="middle">저장</text>

        <rect x="288" y="32" width="200" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="370" y="38" width="36" height="16" rx="2" fill="#f5f5f5"/>
        <text x="388" y="50" class="eyek" text-anchor="middle">보관</text>

        <rect x="552" y="32" width="200" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="634" y="38" width="36" height="16" rx="2" fill="#f5f5f5"/>
        <text x="652" y="50" class="eyek" text-anchor="middle">파생</text>

        <rect x="816" y="32" width="200" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="898" y="38" width="36" height="16" rx="2" fill="#f5f5f5"/>
        <text x="916" y="50" class="eyek" text-anchor="middle">사용</text>

        <path d="M 916 96 V 72 H 388 V 94" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <line x1="208" y1="124" x2="302" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="208" y1="252" x2="302" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="472" y1="124" x2="566" y2="124" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <line x1="472" y1="252" x2="566" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <line x1="736" y1="124" x2="830" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="736" y1="252" x2="830" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="228" y="102" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="256" y="114" class="lblk" text-anchor="middle" fill="#4f5d75">턴 추가</text>

        <rect x="222" y="230" width="68" height="16" rx="2" fill="#f5f5f5"/>
        <text x="256" y="242" class="lblk" text-anchor="middle" fill="#4f5d75">세션 기록</text>

        <rect x="496" y="102" width="48" height="16" rx="2" fill="#f5f5f5"/>
        <text x="520" y="114" class="lblk" text-anchor="middle" fill="#2e5aa8">임베딩</text>

        <rect x="480" y="230" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="520" y="242" class="lblk" text-anchor="middle" fill="#2e5aa8">바뀐 대화만</text>

        <rect x="750" y="102" width="68" height="16" rx="2" fill="#f5f5f5"/>
        <text x="784" y="114" class="lblk" text-anchor="middle" fill="#4f5d75">가까운 순</text>

        <rect x="744" y="230" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="784" y="242" class="lblk" text-anchor="middle" fill="#4f5d75">그룹 · 지도</text>

        <rect x="486" y="50" width="68" height="16" rx="2" fill="#f5f5f5"/>
        <text x="520" y="62" class="lblk" text-anchor="middle" fill="#4f5d75">구간 읽기</text>

        <rect x="40" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="96" width="168" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="124" y="120" class="name" text-anchor="middle">AI 앱</text>
        <text x="124" y="136" class="sub" text-anchor="middle">save · append (MCP)</text>

        <rect x="40" y="224" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="224" width="168" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="124" y="248" class="name" text-anchor="middle">Claude Code 훅</text>
        <text x="124" y="264" class="sub" text-anchor="middle">POST /api/ingest</text>

        <rect x="304" y="96" width="168" height="184" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="96" width="168" height="184" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="388" y="168" class="name" text-anchor="middle">messages</text>
        <text x="388" y="184" class="subk" text-anchor="middle">원문 그대로</text>
        <text x="388" y="199" class="subk" text-anchor="middle">메시지마다 한 행</text>
        <text x="388" y="214" class="subk" text-anchor="middle">유일한 원본</text>

        <rect x="568" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="96" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="652" y="120" class="name" text-anchor="middle">검색 조각</text>
        <text x="652" y="136" class="subk" text-anchor="middle">저장할 때마다</text>

        <rect x="568" y="224" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="224" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="652" y="248" class="name" text-anchor="middle">그룹 새로고침</text>
        <text x="652" y="264" class="subk" text-anchor="middle">제목 · 그룹 · 지도</text>

        <rect x="832" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="832" y="96" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="916" y="120" class="name" text-anchor="middle">검색 도구</text>
        <text x="916" y="136" class="subk" text-anchor="middle">키워드 · 의미</text>

        <rect x="832" y="224" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="832" y="224" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="916" y="248" class="name" text-anchor="middle">대시보드</text>
        <text x="916" y="264" class="subk" text-anchor="middle">그룹 · 3D 지도 · 검색</text>

        <line x1="24" y1="344" x2="1016" y2="344" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <line x1="24" y1="368" x2="52" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="60" y="372" class="keyk" text-anchor="start">흐름</text>
        <line x1="112" y1="368" x2="140" y2="368" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="148" y="372" class="keyk" text-anchor="start">OpenAI 호출</text>
        <line x1="252" y1="368" x2="280" y2="368" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="288" y="372" class="keyk" text-anchor="start">다시 읽기</text>
        <rect x="372" y="362" width="14" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="394" y="372" class="keyk" text-anchor="start">클라이언트</text>
        <rect x="482" y="362" width="14" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="504" y="372" class="keyk" text-anchor="start">파생 데이터</text>
      </svg>
    </div>
  </div>
</body>
</html>
