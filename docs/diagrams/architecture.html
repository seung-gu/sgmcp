<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sgmcp architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase;
      font-weight: 500;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 880px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · sgmcp</p>
    <h1>Who talks to the sgmcp server</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 880 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">sgmcp architecture</title>
        <desc id="architecture-desc">Claude and ChatGPT apps, the Claude Code hook and a browser call the sgmcp server on Fly.io, which stores everything in Neon Postgres and calls OpenAI and WorkOS.</desc>
        <defs>
          <style>
            .name  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
            .sub   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
            .subk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .lbl   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.08em; }
            .lblk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 500; }
            .eye   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.14em; fill: #5a6580; }
            .eyek  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 500; fill: #5a6580; }
            .op    { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.12em; fill: #4f5d75; }
            .guard { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.04em; fill: #4f5d75; }
            .guardk { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .key   { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #4f5d75; }
            .keyk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .note  { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: 14px; font-style: italic; fill: #2d3142; }
            .notek { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: 14px; fill: #2d3142; }
          </style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <rect x="24" y="32" width="224" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="108" y="37" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="136" y="46" class="eye" text-anchor="middle">CLIENTS</text>

        <rect x="328" y="32" width="224" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="396" y="37" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="440" y="46" class="eye" text-anchor="middle">FLY.IO · FRA</text>

        <rect x="632" y="32" width="224" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="712" y="37" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="744" y="46" class="eye" text-anchor="middle">SERVICES</text>

        <line x1="232" y1="144" x2="342" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="232" y1="232" x2="342" y2="232" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <line x1="232" y1="328" x2="342" y2="328" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="536" y1="124" x2="646" y2="124" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <line x1="536" y1="212" x2="646" y2="212" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <line x1="536" y1="300" x2="646" y2="300" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <rect x="272" y="126" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="288" y="135" class="lbl" text-anchor="middle" fill="#4f5d75">/MCP</text>

        <rect x="252" y="214" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="288" y="223" class="lbl" text-anchor="middle" fill="#bf4520">/API/INGEST</text>

        <rect x="256" y="310" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="288" y="319" class="lbl" text-anchor="middle" fill="#4f5d75">/DASHBOARD</text>

        <rect x="578" y="106" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="592" y="115" class="lbl" text-anchor="middle" fill="#2e5aa8">SQL</text>

        <rect x="556" y="194" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="592" y="203" class="lbl" text-anchor="middle" fill="#2e5aa8">EMBED · LLM</text>

        <rect x="548" y="282" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="592" y="291" class="lbl" text-anchor="middle" fill="#2e5aa8">SIGN-IN · JWKS</text>

        <rect x="40" y="112" width="192" height="64" rx="6" fill="#f5f5f5"/>

        <text x="136" y="132" class="name" text-anchor="middle">AI apps</text>
        <text x="136" y="148" class="sub" text-anchor="middle">claude.ai · ChatGPT</text>
        <text x="136" y="163" class="sub" text-anchor="middle">Claude Code · OAuth</text>

        <rect x="40" y="204" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="204" width="192" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="136" y="228" class="name" text-anchor="middle">Claude Code hook</text>
        <text x="136" y="244" class="sub" text-anchor="middle">Stop hook · 0 tokens</text>

        <rect x="40" y="300" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="300" width="192" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="136" y="324" class="name" text-anchor="middle">Browser</text>
        <text x="136" y="340" class="sub" text-anchor="middle">dashboard · sign-in</text>

        <rect x="344" y="64" width="192" height="336" rx="6" fill="#f5f5f5"/>

        <rect x="344" y="64" width="192" height="336" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>

        <text x="360" y="96" class="name" text-anchor="start">sgmcp server</text>

        <text x="360" y="112" class="sub" text-anchor="start">FastMCP · Starlette · uv</text>

        <line x1="360" y1="136" x2="520" y2="136" stroke="rgba(191,69,32,0.25)" stroke-width="0.8"/>

        <text x="360" y="164" class="eye" text-anchor="start">MCP TOOLS</text>

        <text x="360" y="184" class="sub" text-anchor="start">save · append</text>

        <text x="360" y="200" class="sub" text-anchor="start">search · get</text>

        <line x1="360" y1="224" x2="520" y2="224" stroke="rgba(191,69,32,0.25)" stroke-width="0.8"/>

        <text x="360" y="252" class="eye" text-anchor="start">AFTER EACH SAVE</text>

        <text x="360" y="272" class="sub" text-anchor="start">index new passages</text>

        <text x="360" y="288" class="sub" text-anchor="start">in the background</text>

        <line x1="360" y1="312" x2="520" y2="312" stroke="rgba(191,69,32,0.25)" stroke-width="0.8"/>

        <text x="360" y="340" class="eye" text-anchor="start">REFRESH GROUPS</text>

        <text x="360" y="360" class="sub" text-anchor="start">titles · tags · summaries</text>

        <text x="360" y="376" class="sub" text-anchor="start">topic groups · 3D map</text>

        <rect x="648" y="96" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="96" width="192" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="744" y="120" class="name" text-anchor="middle">Neon Postgres 18</text>
        <text x="744" y="136" class="sub" text-anchor="middle">pgvector · messages · groups</text>

        <rect x="648" y="184" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="184" width="192" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="744" y="208" class="name" text-anchor="middle">OpenAI</text>
        <text x="744" y="224" class="sub" text-anchor="middle">embeddings · gpt-4.1-mini</text>

        <rect x="648" y="272" width="192" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="648" y="272" width="192" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="744" y="296" class="name" text-anchor="middle">WorkOS AuthKit</text>
        <text x="744" y="312" class="sub" text-anchor="middle">sign-in · tokens</text>

        <line x1="24" y1="440" x2="856" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <line x1="24" y1="464" x2="52" y2="464" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="60" y="468" class="key" text-anchor="start">hook save</text>
        <line x1="148" y1="464" x2="176" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="184" y="468" class="key" text-anchor="start">MCP · browser</text>
        <line x1="300" y1="464" x2="328" y2="464" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="336" y="468" class="key" text-anchor="start">outbound call</text>
        <rect x="452" y="458" width="14" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="474" y="468" class="key" text-anchor="start">client</text>
        <rect x="542" y="458" width="14" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="564" y="468" class="key" text-anchor="start">database</text>
        <rect x="648" y="458" width="14" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="670" y="468" class="key" text-anchor="start">external service</text>
      </svg>
    </div>
  </div>
</body>
</html>
