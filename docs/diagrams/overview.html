<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sgmcp overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1160px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase;
      font-weight: 500;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Overview · sgmcp</p>
    <h1>How a conversation moves through sgmcp</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-title overview-desc">
        <title id="overview-title">sgmcp overview</title>
        <desc id="overview-desc">Apps save verbatim messages; each save indexes new search passages and Refresh groups derives titles, groups and the map; search returns sections and reads the messages back.</desc>
        <defs>
          <style>
            .name  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
            .sub   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
            .subk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .lbl   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.08em; }
            .lblk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 500; }
            .eye   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.14em; fill: #5a6580; }
            .eyek  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 500; fill: #5a6580; }
            .op    { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.12em; fill: #4f5d75; }
            .guard { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.04em; fill: #4f5d75; }
            .guardk { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .key   { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #4f5d75; }
            .keyk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .note  { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: 14px; font-style: italic; fill: #2d3142; }
            .notek { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: 14px; fill: #2d3142; }
          </style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <rect x="24" y="32" width="200" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="104" y="37" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="124" y="46" class="eye" text-anchor="middle">SAVE</text>

        <rect x="288" y="32" width="200" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="366" y="37" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="388" y="46" class="eye" text-anchor="middle">STORE</text>

        <rect x="552" y="32" width="200" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="626" y="37" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="652" y="46" class="eye" text-anchor="middle">DERIVE</text>

        <rect x="816" y="32" width="200" height="280" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <rect x="900" y="37" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="916" y="46" class="eye" text-anchor="middle">USE</text>

        <path d="M 916 96 V 72 H 388 V 94" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <line x1="208" y1="124" x2="302" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="208" y1="252" x2="302" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="472" y1="124" x2="566" y2="124" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <line x1="472" y1="252" x2="566" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <line x1="736" y1="124" x2="830" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="736" y1="252" x2="830" y2="252" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="234" y="106" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="115" class="lbl" text-anchor="middle" fill="#4f5d75">APPEND</text>

        <rect x="224" y="234" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="256" y="243" class="lbl" text-anchor="middle" fill="#4f5d75">TRANSCRIPT</text>

        <rect x="502" y="106" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="115" class="lbl" text-anchor="middle" fill="#2e5aa8">EMBED</text>

        <rect x="482" y="234" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="243" class="lbl" text-anchor="middle" fill="#2e5aa8">DRIFTED ONLY</text>

        <rect x="760" y="106" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="784" y="115" class="lbl" text-anchor="middle" fill="#4f5d75">NEAREST</text>

        <rect x="746" y="234" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="784" y="243" class="lbl" text-anchor="middle" fill="#4f5d75">GROUPS · MAP</text>

        <rect x="482" y="54" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="63" class="lbl" text-anchor="middle" fill="#4f5d75">READ STRETCH</text>

        <rect x="40" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="96" width="168" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="124" y="120" class="name" text-anchor="middle">AI apps</text>
        <text x="124" y="136" class="sub" text-anchor="middle">save · append (MCP)</text>

        <rect x="40" y="224" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="224" width="168" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="124" y="248" class="name" text-anchor="middle">Claude Code hook</text>
        <text x="124" y="264" class="sub" text-anchor="middle">POST /api/ingest</text>

        <rect x="304" y="96" width="168" height="184" rx="6" fill="#f5f5f5"/>
        <rect x="304" y="96" width="168" height="184" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="388" y="168" class="name" text-anchor="middle">messages</text>
        <text x="388" y="184" class="sub" text-anchor="middle">verbatim text</text>
        <text x="388" y="199" class="sub" text-anchor="middle">one row per message</text>
        <text x="388" y="214" class="sub" text-anchor="middle">the only source</text>

        <rect x="568" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="96" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="652" y="120" class="name" text-anchor="middle">Search passages</text>
        <text x="652" y="136" class="sub" text-anchor="middle">after each save</text>

        <rect x="568" y="224" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="224" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="652" y="248" class="name" text-anchor="middle">Refresh groups</text>
        <text x="652" y="264" class="sub" text-anchor="middle">titles · groups · map</text>

        <rect x="832" y="96" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="832" y="96" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="916" y="120" class="name" text-anchor="middle">Search tools</text>
        <text x="916" y="136" class="sub" text-anchor="middle">keyword · meaning</text>

        <rect x="832" y="224" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="832" y="224" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="916" y="248" class="name" text-anchor="middle">Dashboard</text>
        <text x="916" y="264" class="sub" text-anchor="middle">groups · 3D map · search</text>

        <line x1="24" y1="344" x2="1016" y2="344" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <line x1="24" y1="368" x2="52" y2="368" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="60" y="372" class="key" text-anchor="start">flow</text>
        <line x1="116" y1="368" x2="144" y2="368" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="152" y="372" class="key" text-anchor="start">OpenAI call</text>
        <line x1="256" y1="368" x2="284" y2="368" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="292" y="372" class="key" text-anchor="start">read back</text>
        <rect x="380" y="362" width="14" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="402" y="372" class="key" text-anchor="start">client</text>
        <rect x="470" y="362" width="14" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="492" y="372" class="key" text-anchor="start">derived</text>
      </svg>
    </div>
  </div>
</body>
</html>
