<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meaning search</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1056px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase;
      font-weight: 500;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 936px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · sgmcp</p>
    <h1>How a search finds the right stretch</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 936 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="search-title search-desc">
        <title id="search-title">Meaning search</title>
        <desc id="search-desc">Each save cuts the conversation into passages and embeds the new ones; a question is embedded, matched to each conversation's best passage, grouped into sections, and only that stretch is read.</desc>
        <defs>
          <style>
            .name  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
            .sub   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
            .subk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .lbl   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.08em; }
            .lblk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 500; }
            .eye   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.14em; fill: #5a6580; }
            .eyek  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; font-weight: 500; fill: #5a6580; }
            .op    { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.12em; fill: #4f5d75; }
            .guard { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.04em; fill: #4f5d75; }
            .guardk { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .key   { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 11px; fill: #4f5d75; }
            .keyk  { font-family: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; fill: #4f5d75; }
            .note  { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: 14px; font-style: italic; fill: #2d3142; }
            .notek { font-family: 'Instrument Serif', 'Noto Serif KR', serif; font-size: 14px; fill: #2d3142; }
          </style>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
          <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <text x="32" y="56" class="eye" text-anchor="start">AFTER EACH SAVE</text>

        <text x="32" y="280" class="eye" text-anchor="start">WHEN AN APP SEARCHES</text>

        <line x1="208" y1="100" x2="262" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="352" y1="128" x2="352" y2="182" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <line x1="352" y1="240" x2="352" y2="294" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="208" y1="324" x2="262" y2="324" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <line x1="440" y1="324" x2="494" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <line x1="672" y1="324" x2="726" y2="324" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="222" y="82" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="236" y="91" class="lbl" text-anchor="middle" fill="#4f5d75">CUT</text>

        <rect x="360" y="149" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="378" y="158" class="lbl" text-anchor="middle" fill="#2e5aa8">EMBED</text>

        <rect x="360" y="261" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="384" y="270" class="lbl" text-anchor="middle" fill="#4f5d75">NEAREST</text>

        <rect x="218" y="306" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="236" y="315" class="lbl" text-anchor="middle" fill="#2e5aa8">EMBED</text>

        <rect x="450" y="306" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="468" y="315" class="lbl" text-anchor="middle" fill="#4f5d75">GROUP</text>

        <rect x="684" y="306" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="700" y="315" class="lbl" text-anchor="middle" fill="#4f5d75">OPEN</text>

        <rect x="32" y="72" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="72" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120" y="96" class="name" text-anchor="middle">Conversation</text>
        <text x="120" y="112" class="sub" text-anchor="middle">verbatim messages</text>

        <rect x="264" y="72" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="72" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="352" y="96" class="name" text-anchor="middle">Passages</text>
        <text x="352" y="112" class="sub" text-anchor="middle">1,500 chars + 200 before</text>

        <rect x="264" y="184" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="184" width="176" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="352" y="208" class="name" text-anchor="middle">pgvector index</text>
        <text x="352" y="224" class="sub" text-anchor="middle">HNSW · Neon</text>

        <rect x="32" y="296" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="32" y="296" width="176" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="120" y="320" class="name" text-anchor="middle">Question</text>
        <text x="120" y="336" class="sub" text-anchor="middle">any words, any language</text>

        <rect x="264" y="296" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="296" width="176" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="352" y="320" class="name" text-anchor="middle">Best passage</text>
        <text x="352" y="336" class="sub" text-anchor="middle">per conversation</text>

        <rect x="496" y="296" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="496" y="296" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="584" y="320" class="name" text-anchor="middle">Sections</text>
        <text x="584" y="336" class="sub" text-anchor="middle">message ranges · excerpt</text>

        <rect x="728" y="296" width="176" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="728" y="296" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="816" y="320" class="name" text-anchor="middle">That stretch only</text>
        <text x="816" y="336" class="sub" text-anchor="middle">get_conversation(start)</text>

        <text x="496" y="96" class="note" text-anchor="start">A save embeds only the last passage</text>

        <text x="496" y="116" class="note" text-anchor="start">and the new ones.</text>

        <line x1="32" y1="384" x2="904" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <line x1="32" y1="408" x2="60" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="68" y="412" class="key" text-anchor="start">step</text>
        <line x1="124" y1="408" x2="152" y2="408" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="160" y="412" class="key" text-anchor="start">OpenAI embedding</text>
        <rect x="296" y="402" width="14" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="318" y="412" class="key" text-anchor="start">input</text>
        <rect x="382" y="402" width="14" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="404" y="412" class="key" text-anchor="start">database</text>
      </svg>
    </div>
  </div>
</body>
</html>
