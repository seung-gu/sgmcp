app = "sgmcp-seunggu"
primary_region = "nrt"

[env]
  # Fly 프록시의 X-Forwarded-Proto를 신뢰해 리다이렉트 URL이 https로 생성되도록 함
  FORWARDED_ALLOW_IPS = "*"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
